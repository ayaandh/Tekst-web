name: Deploy playground to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify playground files
        run: |
          test -f playground/index.html
          test -f playground/llvm-to-wat.js
          test -f playground/tekst-compiler.wasm
          test -f playground/tekst-runtime.wasm
          test -f playground/CNAME
      - name: Upload playground site
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
