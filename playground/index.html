<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151311">
<title>Tekst Playground</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#171411;--panel:#211c18;--panel2:#2a231e;--border:#3a3029;--text:#f5ede4;--muted:#b6a99c;--accent:#e9895c;--green:#8bc99e;--red:#e58a80;--code-line:22px;--code-size:13px}
body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select,textarea{font:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100vh;display:flex;flex-direction:column}
.top{min-height:68px;flex:none;display:flex;align-items:center;gap:18px;padding:0 26px;border-bottom:1px solid var(--border);background:rgba(23,20,17,.94)}
.brand{display:inline-flex;align-items:center;flex:none}
.brand img{display:block;width:auto;height:36px;max-width:145px;object-fit:contain}
.title{color:var(--muted);font-size:12px;border-left:1px solid var(--border);padding-left:16px;white-space:nowrap}
.site-nav{display:flex;align-items:center;gap:20px;margin-left:auto}
.site-nav a{color:#9c958e;font-size:12px;text-decoration:none;transition:color .2s}
.site-nav a:hover,.site-nav a[aria-current="page"]{color:var(--accent)}
.spacer{flex:1}
.btn,select{height:36px;border:1px solid var(--border);border-radius:999px;background:var(--panel2);color:var(--text);padding:0 12px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover,select:hover{border-color:#51483f;background:#191614}.btn:disabled{opacity:.6;cursor:wait}
.primary{background:var(--accent);border-color:var(--accent);color:#111;font-weight:750}.primary:hover{background:#ff8950;border-color:#ff8950}
.kbd{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#77716b;white-space:nowrap}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.pane:first-child{border-right:1px solid var(--border)}
.head{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.file{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#cbd0d8}
.head-spacer{flex:1}
.editor{display:flex;flex:1;min-height:0;background:#1c1916}
.lines{width:56px;flex:none;padding:16px 12px 24px 0;text-align:right;color:#58616d;font:var(--code-size)/var(--code-line) ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;overflow:hidden;user-select:none}
.code-wrap{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}
.code-highlight,.code{position:absolute;inset:0;margin:0;padding:16px 18px 32px 0;border:0;font:var(--code-size)/var(--code-line) ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:normal;tab-size:4;white-space:pre;overflow:visible}
.code-highlight{width:max-content;min-width:100%;color:#dce2eb;pointer-events:none;transform:translate(0,0)}
.code{width:100%;height:100%;resize:none;outline:0;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#fff;overflow:auto;z-index:1}
.code-fallback{color:#dce2eb !important;-webkit-text-fill-color:#dce2eb !important}
.code::selection{background:rgba(255,129,43,.28);color:transparent}
.code-highlight .active-line{background:rgba(255,255,255,.045)}
.tok-keyword{color:#ff9a57}.tok-builtin{color:#71c9ff}.tok-string{color:#9bd897}.tok-number{color:#c6a4ff}.tok-comment{color:#77818e;font-style:italic}.tok-constant{color:#f3c66f}
.output{flex:1;min-height:0;margin:0;padding:18px;background:#1c1916;color:#e8dfd5;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}
.bottom{height:36px;flex:none;display:flex;align-items:center;gap:14px;padding:0 15px;border-top:1px solid var(--border);background:var(--panel)}
.status{font-size:11px;color:var(--muted)}.status.ok{color:var(--green)}.status.err{color:var(--red)}.bottom-spacer{flex:1}

.top{min-height:74px;padding:0 28px;border-color:#39312b;background:rgba(21,19,17,.92)}
.title{padding:7px 12px;border:1px solid #39312b;border-radius:999px;background:#201c19;color:#c0b4a9}

.site-nav a{padding:9px 12px;border-radius:999px;color:#b9ada2}
.site-nav a:hover,.site-nav a[aria-current="page"]{background:#29231f;color:#f5eee7}
.btn,select{border-color:#493b31;background:#29231f;color:#f5eee7}
.btn:hover,select:hover{border-color:#76503a;background:#352a23}
.primary{background:#f0804f;border-color:#f0804f;color:#21140e}
.primary:hover{background:#f59b69;border-color:#f59b69}

.pane:first-child{border-color:#39312b}
.head,.bottom{border-color:#39312b;background:#29231f}
.editor,.output{background:#1b1815}

<script type="module">
import {translate} from "./llvm-to-wat.js";

const code=document.getElementById("code");
const lines=document.getElementById("lines");
const highlight=document.getElementById("highlight");
const output=document.getElementById("output");
const editorStatus=document.getElementById("editorStatus");
const draftStatus=document.getElementById("draftStatus");
const codeStats=document.getElementById("codeStats");
const runStatus=document.getElementById("runStatus");
const runButton=document.getElementById("run");
const example=document.getElementById("example");
const inputDialog=document.getElementById("inputDialog");
const inputForm=document.getElementById("inputForm");
const inputPrompt=document.getElementById("inputPrompt");
const inputValue=document.getElementById("inputValue");
const storageKey="tekst-playground-draft";
const initialCode=`print("Hello, Tekst!")`;

// Keep the editor usable even if syntax highlighting fails to render.
function editorFallback(message){
    highlight.textContent=code.value;
    highlight.style.transform=`translate(${-code.scrollLeft}px, ${-code.scrollTop}px)`;
    code.classList.add("code-fallback");
    if(message) console.warn(message);
}

const examples={
    hello:initialCode,
    values:`name = "Tekst"
count = int("3")
ratio = float("2.5")
active = bool(count)
print("Hello {name}")
print("count:", count, "ratio:", ratio, "active:", active)
print("length:", len(name), "None:", None)`,
    functions:`fn greet(name, greeting = "Hello"):
    return greeting + ", " + name

fn twice(value):
    return value * 2

double = fn(value): value * 2
print(greet("Tekst"))
print(greet("world", "Welcome"))
print(twice(6), double(6))
print("short-circuit:", False and True, True or False)`,
    control:`score = 84
if score >= 90:
    grade = "A"
elif score >= 80:
    grade = "B"
else:
    grade = "Keep practicing"
print("Grade:", grade)

match grade:
    case "A":
        print("Excellent")
    case "B":
        print("Good work")
    case _:
        print("Keep going")`,
    loops:`total = 0
for i in range(1, 10):
    if i == 3:
        continue
    if i == 7:
        break
    total += i
print("for total:", total)

count = 0
while count < 3:
    print("while:", count)
    count += 1`,
    collections:`numbers = [2, 4, 6, 8]
squares = [n * n for n in numbers]
first, second = (squares[0], squares[1])
numbers[1] = 5
person = {"name": "Ada", "age": 36}
person["age"] += 1
print("squares:", squares)
print("first pair:", first, second)
print("updated:", numbers, person["age"])`,
    strings:`message = "tekst playground"
shout = message.upper()
words = message.split(" ")
changed = message.replace("tekst", "Tekst")
word_count = len(words)
print(shout)
print(words, words.contains("playground"))
print(changed, "has {word_count} words")`,
    classes:`class Counter:
    fn __init__(self, start = 0):
        self.value = start

    fn increment(self, amount = 1):
        self.value += amount
        return self.value

struct Point:
    x: int = 3
    y: int = 4

counter = Counter(10)
point = Point()
print("counter:", counter.increment(), counter.increment(4))
print("point:", point.x, point.y)`,
    defer:`fn work():
    defer print("cleanup runs before return")
    print("working")
    return 42

print("result:", work())`,
    modules:`use math
use json
use fs
use random
use time
use os
from math use sqrt as root

value = {"area": math.pi * 3 * 3, "ok": True}
encoded = json.encode(value)
decoded = json.decode(encoded)
fs.write("playground-test.tmp", encoded)
random.seed(42)
print("pi:", math.pi)
print("sqrt:", math.sqrt(81))
print("imported sqrt:", root(49))
print("minimum:", math.min(9, 2, 4))
print("json:", encoded)
print("decoded area:", decoded["area"])
print("file contents:", fs.read("playground-test.tmp"))
print("random:", random.randint(1, 6))
print("time available:", time.timestamp() > 0)
print("working directory:", os.cwd())
fs.remove("playground-test.tmp")`,
    input:`name = input("What is your name?")
age = int(input("How old are you?"))
next_age = age + 1
print("Hello {name}; next year you will be {next_age}")`
};

function setStatus(element,text,type=""){
    element.textContent=text;
    element.className="status"+(type?" "+type:"");
}

function escapeHTML(text){
    return text.replace(/[&<>"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
}

function highlightLine(line){
    const tokenPattern=/#.*$|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:fn|class|struct|extends|if|elif|else|while|for|in|return|break|continue|pass|and|or|not|try|catch|throw|use|from|as|match|case|defer|lambda)\b|\b(?:True|False|None|true|false|null)\b|\b(?:print|input|int|float|str|bool|len|range|alloc|free)\b|\b\d+(?:\.\d+)?\b/g;
    let result="";
    let previous=0;
    for(const match of line.matchAll(tokenPattern)){
        result+=escapeHTML(line.slice(previous,match.index));
        const token=match[0];
        let kind="keyword";
        if(token.startsWith("#"))kind="comment";
        else if(token.startsWith('"')||token.startsWith("'"))kind="string";
        else if(/^\d/.test(token))kind="number";
        else if(/^(True|False|None|true|false|null)$/.test(token))kind="constant";
        else if(/^(print|input|int|float|str|bool|len|range|alloc|free)$/.test(token))kind="builtin";
        result+=`<span class="tok-${kind}">${escapeHTML(token)}</span>`;
        previous=match.index+token.length;
    }
    return result+escapeHTML(line.slice(previous))||" ";
}

function updateEditor(){
    const source=code.value;
    code.classList.remove("code-fallback");
    const sourceLines=source.split("\n");
    lines.textContent=sourceLines.map((_,index)=>index+1).join("\n");
    const activeLine=source.slice(0,code.selectionStart).split("\n").length-1;
    try {
    highlight.innerHTML=sourceLines.map((line,index)=>{
        const contents=highlightLine(line);
        return index===activeLine?`<span class="active-line">${contents}</span>`:contents;
    }).join("\n");
    } catch(error) {
        editorFallback(`Syntax highlighting failed: ${error.message||error}`);
    }
    highlight.style.transform=`translate(${-code.scrollLeft}px, ${-code.scrollTop}px)`;
    codeStats.textContent=`${sourceLines.length} lines · ${source.length} chars`;
}

function saveDraft(){
    try{
        localStorage.setItem(storageKey,code.value);
        setStatus(draftStatus,"Draft saved locally","ok");
    }catch(error){
        setStatus(draftStatus,"Local draft could not be saved","err");
        console.error("Could not save the playground draft",error);
    }
}

function updateCode(){
    updateEditor();
    saveDraft();
}

function setCode(value,message){
    code.value=value;
    updateCode();
    setStatus(editorStatus,message);
    code.focus();
}

function indentSelection(outdent){
    const start=code.selectionStart;
    const end=code.selectionEnd;
    const source=code.value;
    const lineStart=source.lastIndexOf("\n",start-1)+1;
    let lineEnd=source.indexOf("\n",end);
    if(lineEnd<0)lineEnd=source.length;
    const selected=source.slice(lineStart,lineEnd);
    const replaced=selected.split("\n").map(line=>{
        if(!outdent)return "    "+line;
        return line.replace(/^(?: {1,4}|\t)/,"");
    }).join("\n");
    const startPrefix=source.slice(lineStart,start);
    const changedPrefix=startPrefix.split("\n").map(line=>{
        if(!outdent)return "    "+line;
        return line.replace(/^(?: {1,4}|\t)/,"");
    }).join("\n");
    code.setRangeText(replaced,lineStart,lineEnd,"select");
    const selectionStart=lineStart+changedPrefix.length;
    const delta=replaced.length-selected.length;
    const selectionEnd=Math.max(selectionStart,end+delta);
    code.setSelectionRange(selectionStart,selectionEnd);
    updateCode();
}

function toggleComment(){
    const start=code.selectionStart;
    const end=code.selectionEnd;
    const source=code.value;
    const lineStart=source.lastIndexOf("\n",start-1)+1;
    let lineEnd=source.indexOf("\n",end);
    if(lineEnd<0)lineEnd=source.length;
    const selected=source.slice(lineStart,lineEnd);
    const uncomment=selected.split("\n").every(line=>!line.trim()||/^\s*#/.test(line));
    const replaced=selected.split("\n").map(line=>{
        if(uncomment)return line.replace(/^(\s*)# ?/,"$1");
        return line.trim()?line.replace(/^(\s*)/,"$1# "):line;
    }).join("\n");
    code.setRangeText(replaced,lineStart,lineEnd,"select");
    code.setSelectionRange(start,end+replaced.length-selected.length);
    updateCode();
}

let compilePromise;
let wabtPromise;
let wasiPromise;

async function loadAsset(path,label){
    let response;
    try{
        response=await fetch(path,{cache:"no-store"});
    }catch(error){
        throw new Error(`Could not fetch ${label} from ${new URL(path,location.href).href}. Confirm that GitHub Pages deployed the file and that the page is being opened over HTTPS. (${error.message})`);
    }
    if(!response.ok)throw new Error(`Could not load ${label} (HTTP ${response.status}) from ${response.url}`);
    return response;
}

async function loadWasi(){
    if(!wasiPromise){
        wasiPromise=import("https://cdn.jsdelivr.net/npm/@bjorn3/browser_wasi_shim@0.4.2/+esm").catch(error=>{
            wasiPromise=undefined;
            throw new Error(`Could not load the browser WASI support library from jsDelivr. Check your internet connection or CDN access. (${error.message})`);
        });
    }
    return wasiPromise;
}

async function compileSource(source,onStage=()=>{}){
    onStage("loading compiler");
    if(!compilePromise){
        compilePromise=(async()=>{
            const response=await loadAsset("./tekst-compiler.wasm","Tekst compiler WebAssembly module");
            return response.arrayBuffer();
        })().catch(error=>{
            compilePromise=undefined;
            throw error;
        });
    }
    const bytes=await compilePromise;
    onStage("compiling source");
    let stdout="";
    let stderr="";
    const {WASI,File,OpenFile,ConsoleStdout}=await loadWasi();
    const stdin=new OpenFile(new File(new TextEncoder().encode(source)));
    const out=ConsoleStdout.lineBuffered(text=>stdout+=text+"\n");
    const err=ConsoleStdout.lineBuffered(text=>stderr+=text+"\n");
    const wasi=new WASI(["tekst-compiler"],[],[stdin,out,err]);
    const {instance}=await WebAssembly.instantiate(bytes,{wasi_snapshot_preview1:wasi.wasiImport});
    let exitCode;
    try{
        exitCode=wasi.start(instance);
    }catch(error){
        const detail=error instanceof WebAssembly.Exception
            ?"A compiler WebAssembly exception prevented source diagnostics. The source may contain invalid syntax or a construct this browser compiler does not support."
            :`Tekst compiler stopped before reporting a diagnostic: ${error.message||String(error)}`;
        throw new Error(stderr.trim()||detail);
    }
    if(stderr.trim())throw new Error(stderr.trim());
    if(exitCode!==0)throw new Error(`Tekst compiler exited with status ${exitCode} without a diagnostic.`);
    if(!stdout.trim())throw new Error("The Tekst compiler produced no LLVM IR");
    return stdout;
}

function requestInput(promptText){
    inputPrompt.textContent=promptText;
    inputValue.value="";
    const closed=new Promise(resolve=>{
        inputDialog.addEventListener("close",()=>{
            resolve(inputDialog.returnValue==="submit"?inputValue.value:"");
        },{once:true});
    });
    inputDialog.showModal();
    inputValue.focus();
    return closed;
}

document.getElementById("inputCancel").addEventListener("click",()=>inputDialog.close("cancel"));
inputForm.addEventListener("submit",event=>{
    event.preventDefault();
    inputDialog.close("submit");
});

async function collectInput(source){
    const calls=[...source.matchAll(/\binput\s*\(\s*("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')?/g)];
    if(!calls.length)return "";
    const values=[];
    for(const [index,call] of calls.entries()){
        const rawPrompt=call[1];
        const prompt=rawPrompt?rawPrompt.slice(1,-1).replace(/\\n/g,"\n"):`Input ${index+1}`;
        values.push(await requestInput(prompt));
    }
    return values.join("\n")+"\n";
}

async function runRuntime(wasmBytes,inputText){
    const {WASI,File,OpenFile,ConsoleStdout,PreopenDirectory}=await loadWasi();
    let stdout="";
    let stderr="";
    const out=ConsoleStdout.lineBuffered(text=>stdout+=text+"\n");
    const err=ConsoleStdout.lineBuffered(text=>stderr+=text+"\n");
    const stdin=new OpenFile(new File(new TextEncoder().encode(inputText)));
    const wasi=new WASI(["tekst-runtime"],[],[stdin,out,err,new PreopenDirectory(".",[])]);
    const {instance}=await WebAssembly.instantiate(wasmBytes,{wasi_snapshot_preview1:wasi.wasiImport});
    const runtime=instance.exports;
    wasi.initialize(instance);
    if(typeof runtime.__wasm_call_ctors==="function")runtime.__wasm_call_ctors();
    if(!runtime.memory)throw new Error("Tekst runtime does not export memory");
    const minimumBytes=32*1024*1024;
    if(runtime.memory.buffer.byteLength<minimumBytes){
        runtime.memory.grow(Math.ceil((minimumBytes-runtime.memory.buffer.byteLength)/65536));
    }
    return {runtime,getStdout:()=>stdout,getStderr:()=>stderr};
}

async function compileWat(wat){
    if(!wabtPromise){
        wabtPromise=import("https://cdn.jsdelivr.net/npm/wabt@1.0.39/+esm").then(async module=>{
            const initialize=module.default||module;
            return initialize();
        }).catch(error=>{
            wabtPromise=undefined;
            throw new Error(`Could not load the WebAssembly text compiler from jsDelivr. Check your internet connection or CDN access. (${error.message})`);
        });
    }
    const wabt=await wabtPromise;
    const parsed=wabt.parseWat("tekst-generated.wat",wat,{exceptions:true,bulk_memory:true,reference_types:true,multi_value:true});
    try{
        parsed.resolveNames();
        parsed.validate();
        return parsed.toBinary({write_debug_names:true}).buffer;
    }finally{
        parsed.destroy();
    }
}

async function run(){
    if(runButton.disabled)return;
    runButton.disabled=true;
    runButton.textContent="Running…";
    output.textContent="Compiling Tekst…";
    setStatus(editorStatus,"Compiling");
    setStatus(runStatus,"Compiling…");
    let stage="loading compiler";
    try{
        const ir=await compileSource(code.value,value=>stage=value);
        stage="translating LLVM IR";
        const wat=translate(ir);
        stage="loading WebAssembly text compiler";
        const programWasm=await compileWat(wat);
        stage="loading runtime";
        const runtimeResponse=await loadAsset("./tekst-runtime.wasm","Tekst runtime WebAssembly module");
        const runtimeBytes=await runtimeResponse.arrayBuffer();
        stage="running program";
        const inputText=await collectInput(code.value);
        const {runtime,getStdout,getStderr}=await runRuntime(runtimeBytes,inputText);
        const program=await WebAssembly.instantiate(programWasm,{runtime});
        if(typeof program.instance.exports.main!=="function")throw new Error("Generated WebAssembly has no main function");
        program.instance.exports.main();
        const runtimeStderr=getStderr().trim();
        if(runtimeStderr)throw new Error(runtimeStderr);
        output.textContent=getStdout().trim()||"Program finished with no output.";
        setStatus(runStatus,"Finished successfully","ok");
        setStatus(editorStatus,"Program finished","ok");
    }catch(error){
        const message=error?.message||String(error);
        output.textContent=`${stage[0].toUpperCase()+stage.slice(1)} failed:\n\n${message}`;
        setStatus(runStatus,"Failed","err");
        setStatus(editorStatus,"Execution failed","err");
    }finally{
        runButton.disabled=false;
        runButton.textContent="Run ▶";
    }
}

example.addEventListener("change",()=>{
    if(examples[example.value])setCode(examples[example.value],"Example loaded");
    example.value="";
});

document.getElementById("reset").addEventListener("click",()=>{
    setCode(initialCode,"Editor reset");
    output.textContent="Run your Tekst program to see its output here.";
    setStatus(runStatus,"Not run");
});
document.getElementById("clearOutput").addEventListener("click",()=>{
    output.textContent="";
    setStatus(runStatus,"Output cleared");
});
runButton.addEventListener("click",run);
code.addEventListener("input",updateCode);
code.addEventListener("click",updateEditor);
code.addEventListener("keyup",updateEditor);
code.addEventListener("scroll",()=>{
    lines.scrollTop=code.scrollTop;
    updateEditor();
});
code.addEventListener("keydown",event=>{
    if(event.key==="Tab"){
        event.preventDefault();
        if(event.shiftKey)indentSelection(true);
        else if(code.selectionStart!==code.selectionEnd)indentSelection(false);
        else{
            code.setRangeText("    ",code.selectionStart,code.selectionEnd,"end");
            updateCode();
        }
        return;
    }
    if((event.ctrlKey||event.metaKey)&&event.key==="/"){
        event.preventDefault();
        toggleComment();
        return;
    }
    if((event.ctrlKey||event.metaKey)&&event.key==="Enter"){
        event.preventDefault();
        run();
        return;
    }
    if(event.key==="Enter"){
        const before=code.value.slice(0,code.selectionStart);
        const line=before.slice(before.lastIndexOf("\n")+1);
        const indent=line.match(/^\s*/)[0];
        const extraIndent=/:\s*$/.test(line.trimEnd())?"    ":"";
        event.preventDefault();
        code.setRangeText(`\n${indent}${extraIndent}`,code.selectionStart,code.selectionEnd,"end");
        updateCode();
        return;
    }
    if(["(","[","{","'",'"'].includes(event.key)){
        const start=code.selectionStart;
        const end=code.selectionEnd;
        if(start===end&&code.value[start]===event.key&&["'",'"'].includes(event.key)){
            event.preventDefault();
            code.setSelectionRange(start+1,start+1);
            return;
        }
        const close={"(":")","[":"]","{":"}","'":"'","\"":"\""}[event.key];
        event.preventDefault();
        const selected=code.value.slice(start,end);
        code.setRangeText(event.key+selected+close,start,end,"end");
        if(selected)code.setSelectionRange(start+1,end+1);
        else code.setSelectionRange(start+1,start+1);
        updateCode();
    }
});

try{
    const savedDraft=localStorage.getItem(storageKey);
    code.value=savedDraft??initialCode;
    setStatus(draftStatus,savedDraft===null?"Auto-save enabled":"Draft restored locally","ok");
}catch(error){
    code.value=initialCode;
    setStatus(draftStatus,"Local draft unavailable","err");
    console.error("Could not restore the playground draft",error);
}
updateEditor();
window.addEventListener("error",event=>console.error("Tekst playground error:",event.error||event.message));
window.addEventListener("unhandledrejection",event=>console.error("Tekst playground promise error:",event.reason));
</script>
